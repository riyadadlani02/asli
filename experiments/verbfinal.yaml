# Experiment B — does semantic end-of-turn detection inherit an SVO blind spot?
#
# Hindi is verb-final. A caller can therefore stop mid-thought on a word that is a
# perfectly legal sentence ending — a finite verb or copula — where English speakers
# would stop on an obvious dangler like "the" or "because".
#
# Each item is a minimal pair. `head` ends on a finite verb; the hesitation is spliced
# in the same place either way. The only difference is whether a filler stands between
# the verb and the entity:
#
#   filler     : "<head> matlab … <entity>"   the lexical policy fires
#   verb-final : "<head> … <entity>"          the lexical policy CANNOT fire
#
# If semantic detection holds both, it is not SVO-shaped. If it holds the filler and
# splits the verb-final one, the blind spot is shared and unsolved.

