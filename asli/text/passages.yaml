# The text instantiation of SFR. Authored, not sourced: ground truth costs nothing,
# licensing is nil, and no public QA set can have leaked these into a training corpus.
#
# `slot` is the one record carrying the answer, inserted at index 1 so it is neither
# first nor last. `surface` is how the value appears before corruption — corruptors
# mutate the surface and the record is re-rendered, so the injected error is exact.
#
# Amounts appear in Indian words as often as figures. That is deliberate: it keeps the
# lakh/crore parsing live in a domain with no recogniser to blame, which is what the
# clean arm needs to test whether stance bleeds into parsing.

