# Experiment B, redesigned. Three arms, not two.
#
# The old design could not distinguish "semantic detection has a verb-final blind spot"
# from "semantic detection is just bad at Hindi". This one can, because it adds a
# positive control: an arm where the pause falls after an English-SHAPED dangler — a
# genitive or a conjunction, the Hindi equivalent of stopping on "the" or "and".
#
#   dangler     <head ending in uska/aur/kyunki> … <entity>   English-shaped incomplete
#   filler      <head ending in verb> matlab … <entity>       discourse marker
#   verb-final  <head ending in verb> … <entity>              legal-looking sentence end
#
# The dangler arm is the gate. If semantic detection cannot hold that, it cannot do
# semantic end-of-turn in Hindi at all and the verb-final comparison is unreportable.
# If it holds the dangler and splits the verb-final, the blind spot is real AND
# specific — which is the only version of this claim that survives review.
#
# Heads are long and unambiguously declarative: the old corpus lost 8/48 rows to heads
# short enough to be read as questions. `filler_head` is built as verb_head + " matlab",
# so the filler and verb-final arms differ by exactly one token.
#
# Digits and amounts only. Spoken dates need a digit year to parse, and the entity is
# only a secondary readout here — PIR is scored off the splice, not the transcript.

